name: Split

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  split:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: core, repository: laravel-microservices-core, key: SPLIT_KEY_CORE }
          - { package: http-rpc, repository: laravel-microservices-http-rpc, key: SPLIT_KEY_HTTP_RPC }
          - { package: redis-stream, repository: laravel-microservices-redis-stream, key: SPLIT_KEY_REDIS_EVENT_STREAM }
          - { package: queue-stream, repository: laravel-microservices-queue-stream, key: SPLIT_KEY_QUEUE_EVENT_STREAM }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each mirror has its own deploy key: GitHub refuses one key on several repositories.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets[matrix.key] }}

      - name: Push packages/${{ matrix.package }} to mk-josias/${{ matrix.repository }}
        run: |
          split=$(git subtree split --prefix=packages/${{ matrix.package }} HEAD)
          remote=git@github.com:mk-josias/${{ matrix.repository }}.git
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            git push "$remote" "$split:refs/tags/${GITHUB_REF_NAME}"
          else
            git push --force "$remote" "$split:refs/heads/main"
          fi
